name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ls -la
          for f in *.zip; do unzip -o "$f"; done
          P=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")
          echo "Project folder: $P"
          echo "PROJECT=$P" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJECT }}
      - uses: actions/upload-artifact@v4
        with:
          name: KeyVault-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
